<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AI Revenue Recovery Agent architecture</title>
<desc>Two entry points, batch demo and real Razorpay webhook, feed into a four-stage pipeline: diagnose, decide, execute, log. The log feeds a real-time dashboard via API and a real Razorpay payment link.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5b6478" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#e8b94a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="900" height="620" fill="#0a0f1c"/>

<!-- font -->
<style>
  text { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; fill: #9aa3b8; }
  .title { font-size: 14px; font-weight: 600; fill: #f0eee6; }
  .sub   { font-size: 11px; fill: #9aa3b8; }
  .stage-n { font-size: 20px; fill: #e8b94a; font-weight: 600; }
</style>

<text x="40" y="36" class="label">AI Revenue Recovery Agent — architecture</text>

<!-- ===== ROW 1: two entry points ===== -->
<g>
  <rect x="60" y="64" width="230" height="64" rx="6" fill="#121a2e" stroke="#25304a" stroke-width="1"/>
  <text x="175" y="90" text-anchor="middle" class="title">Batch demo</text>
  <text x="175" y="108" text-anchor="middle" class="sub">Synthetic failure batch</text>
</g>
<g>
  <rect x="610" y="64" width="230" height="64" rx="6" fill="#121a2e" stroke="#c1443a" stroke-width="1"/>
  <text x="725" y="90" text-anchor="middle" class="title" fill="#f7b8b0">Razorpay webhook</text>
  <text x="725" y="108" text-anchor="middle" class="sub">Real payment.failed event, signature-verified</text>
</g>

<!-- connectors from row1 down into diagnose -->
<path d="M175 128 L175 160 L 260 160 L 260 190" fill="none" stroke="#5b6478" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M725 128 L725 160 L 640 160 L 640 190" fill="none" stroke="#c1443a" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ===== ROW 2: 4-stage pipeline ===== -->
<!-- Diagnose -->
<g>
  <rect x="150" y="190" width="150" height="80" rx="6" fill="#141b2e" stroke="#e8b94a" stroke-width="1"/>
  <text x="225" y="216" text-anchor="middle" class="stage-n">01</text>
  <text x="225" y="240" text-anchor="middle" class="title">Diagnose</text>
  <text x="225" y="257" text-anchor="middle" class="sub">Rule-based, LLM fallback</text>
</g>
<!-- Decide -->
<g>
  <rect x="340" y="190" width="150" height="80" rx="6" fill="#141b2e" stroke="#e8b94a" stroke-width="1"/>
  <text x="415" y="216" text-anchor="middle" class="stage-n">02</text>
  <text x="415" y="240" text-anchor="middle" class="title">Decide</text>
  <text x="415" y="257" text-anchor="middle" class="sub">Bounded, hard stop rules</text>
</g>
<!-- Execute -->
<g>
  <rect x="530" y="190" width="150" height="80" rx="6" fill="#141b2e" stroke="#e8b94a" stroke-width="1"/>
  <text x="605" y="216" text-anchor="middle" class="stage-n">03</text>
  <text x="605" y="240" text-anchor="middle" class="title">Execute</text>
  <text x="605" y="257" text-anchor="middle" class="sub">Real Razorpay payment link</text>
</g>

<line x1="300" y1="230" x2="338" y2="230" stroke="#5b6478" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="490" y1="230" x2="528" y2="230" stroke="#5b6478" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M680 230 L 700 230 L 700 340 L 450 340 L 450 320" fill="none" stroke="#5b6478" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Log -->
<g>
  <rect x="375" y="320" width="150" height="80" rx="6" fill="#141b2e" stroke="#3ecf8e" stroke-width="1"/>
  <text x="450" y="346" text-anchor="middle" class="stage-n" fill="#3ecf8e">04</text>
  <text x="450" y="370" text-anchor="middle" class="title">Log</text>
  <text x="450" y="387" text-anchor="middle" class="sub">SQLite audit trail</text>
</g>

<!-- ===== ROW 3: outputs from Log ===== -->
<path d="M400 400 L 400 460 L 220 460 L 220 480" fill="none" stroke="#5b6478" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M500 400 L 500 460 L 680 460 L 680 480" fill="none" stroke="#e8b94a" stroke-width="1.2" marker-end="url(#arrow-gold)"/>

<g>
  <rect x="80" y="480" width="280" height="70" rx="6" fill="#121a2e" stroke="#25304a" stroke-width="1"/>
  <text x="220" y="508" text-anchor="middle" class="title">Streamlit dashboard</text>
  <text x="220" y="526" text-anchor="middle" class="sub">API client — points at any backend URL</text>
</g>

<g>
  <rect x="560" y="480" width="280" height="70" rx="6" fill="#121a2e" stroke="#e8b94a" stroke-width="1"/>
  <text x="700" y="508" text-anchor="middle" class="title" fill="#f2d38a">Razorpay test API</text>
  <text x="700" y="526" text-anchor="middle" class="sub">Real payment link created + polled</text>
</g>

<!-- legend -->
<g>
  <rect x="60" y="578" width="10" height="10" fill="#c1443a" rx="2"/>
  <text x="78" y="587" class="sub">Real, signed, live path</text>
  <rect x="260" y="578" width="10" height="10" fill="#e8b94a" rx="2"/>
  <text x="278" y="587" class="sub">Real Razorpay API call</text>
  <rect x="460" y="578" width="10" height="10" fill="#3ecf8e" rx="2"/>
  <text x="478" y="587" class="sub">Audit trail — nothing deleted</text>
</g>

</svg>
